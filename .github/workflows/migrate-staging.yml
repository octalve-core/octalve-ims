name: Deploy migrations to staging

# main is the staging branch -- every push that touches the Prisma schema
# or migrations applies pending migrations to the staging database
# automatically. Low risk by design: staging is never the database real
# users hit (that's prod, gated by migrate-production.yml).
on:
  push:
    branches: [main]
    paths:
      - 'prisma/migrations/**'
      - 'prisma/schema/**'

# Never cancel a migration mid-flight -- a superseding push waits instead.
concurrency:
  group: migrate-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate staging database
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: '10'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # DIRECT_URL, not the pooled DATABASE_URL: `migrate deploy` takes a
      # session-level advisory lock that a transaction-mode pooler drops.
      # prisma.config.ts prefers DIRECT_URL and falls back to DATABASE_URL.
      # If this step sees empty values, the secrets aren't defined on this
      # job's GitHub *Environment* (staging) -- Settings -> Environments ->
      # staging -> Secrets, not repo/org secrets.
      - name: prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate:deploy

      - name: prisma migrate status
        if: always()
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma migrate status
