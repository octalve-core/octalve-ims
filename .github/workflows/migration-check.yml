name: Check migrations against staging

# Read-only safety net: on any PR into main or prod that touches the schema
# or migrations, validate the schema and diff it against the staging
# database before merge -- catches drift or conflicts before they reach
# migrate-staging.yml's auto-apply or a manual migrate-production.yml run.
# Never writes to any database.
on:
  pull_request:
    branches: [main, prod]
    paths:
      - 'prisma/migrations/**'
      - 'prisma/schema/**'

permissions:
  contents: read

jobs:
  check:
    name: Validate schema & diff against staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    # Forks don't get repository/environment secrets, so this would fail
    # with a confusing auth error rather than being skipped -- same guard
    # preview.yml already uses for the same reason.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      # Job-level so `prisma validate` also has it -- the schema's
      # datasource block resolves env("DATABASE_URL") even just to
      # validate, not only to run the diff in the step below.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: '10'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: prisma validate
        run: pnpm exec prisma validate

      - name: Diff staging against this branch's schema
        run: |
          echo "Pending schema diff for staging (informational -- does not fail the build):"
          pnpm exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema \
            --script || true
