name: Preview Deploy

# Preview deploys are deliberately NOT gated on the test job: they exist to
# put a reviewable URL on a PR quickly. Production is gated -- see
# migrate-production.yml / deploy-production.yml.
#
# IMPORTANT: previews must point at a NON-production database. Set a preview
# DATABASE_URL in the Vercel project (Settings -> Environment Variables,
# scoped to "Preview"), or a PR will read and write live customer data.
on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Deploy preview to Vercel
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 15
    # Forks don't get repository secrets, so this would fail with a confusing
    # auth error rather than being skipped.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install Vercel CLI
        run: pnpm add -g vercel@65.12.1

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
